[package]
name = "dealbreaker"
version = "0.1.0"
edition = "2021"
authors = ["itsF4LCON <107556180+itsF4LCON@users.noreply.github.com>"]

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = "0.8"
worker-macros = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
getrandom = { version = "0.2", features = ["js"] }
dealbreaker-engine = { path = "engine" }

[workspace]
members = ["engine"]

[profile.release]
opt-level = "s"
lto = true
