name = "dealbreaker"
main = "build/index.js"
compatibility_date = "2026-09-19"

routes = [
  { pattern = "dealbreaker.xivlabs.tech", custom_domain = true }
]

[build]
command = "cargo install -q \"worker-build@^0.8\" && worker-build --release"

[assets]
directory = "./public"
binding = "ASSETS"

[observability]
enabled = false

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[ratelimits]]
name = "CREATE_LIMITER"
namespace_id = "7201"
simple = { limit = 10, period = 60 }
